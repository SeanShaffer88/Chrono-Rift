name: Headless tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3-stable
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version

      - name: Build import cache
        run: |
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . --editor --quit || true
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . --editor --quit || true

      - name: Run tests
        run: |
          set +e +o pipefail
          status=0
          for test in tests/test_*.gd; do
            [ "$test" = "tests/test_harness_template.gd" ] && continue
            echo "::group::$test"
            timeout 120 "$RUNNER_TEMP/godot" --headless --path . -s "$test" 2>&1 | tee test_output.log
            code=${PIPESTATUS[0]}
            # Script errors don't always change the exit code, so check the output too.
            if [ "$code" != "0" ] || grep -qE "FAIL:|SCRIPT ERROR|Parse Error" test_output.log; then
              status=1
              # Surface errors as an annotation so they are readable without downloading logs.
              summary=$(grep -E -A2 "FAIL:|SCRIPT ERROR|Parse Error|Test timed out" test_output.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$test failed (exit $code)::${summary}"
            fi
            echo "::endgroup::"
          done
          exit $status
