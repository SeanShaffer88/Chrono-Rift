name: Headless tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned Godot and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < .godot-version)
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          base="https://github.com/godotengine/godot/releases/download/${version}-stable"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o "$archive" "$base/$archive"
          curl --fail --location --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          awk -v name="$archive" '$2 == name || $2 == "*" name { print }' SHA512-SUMS.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha512sum --check selected-checksum.txt
          unzip -q "$archive"
          mv "Godot_v${version}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import and run all tests
        shell: pwsh
        run: ./tools/Test-Project.ps1 -GodotPath "$env:RUNNER_TEMP/godot"

      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .godot/verification/
          if-no-files-found: ignore
